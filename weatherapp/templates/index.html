<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        input,button, .hava_durumu{
            display: block;
            width: 250px;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        input{
            border: 1px solid #ccc;
        }
        button{
            background-color: #114399;
            color: #c8dee0;
        }
    </style>
</head>
<body>
    <form class="hide" method="POST" action="/ara">
        <input type="text" name="sehir" id="sehir">
        <br>
        <button type="submit">Ara</button>
    </form>
    {% if sehir_adi %}
    <img style="width: 200px; height: 200px;" src="{{ image }}" alt=""><br>
    <div class="hava_durumu">
        Sehir adi: {{ sehir_adi }}<br>
        Sicaklik: {{ sicaklik }}<br>
        Hava Durumu: {{ hava_durumu }}
    </div>
    {% endif %}

    <script>
        const form = document.getElementsByClassName("hide")[0]
        if ("{{sehir_adi}}"){
            form.style.display = "none";
        }
    </script>
</body>
</html>
