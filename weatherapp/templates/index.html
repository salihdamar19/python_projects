<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        input,button, .hava_durumu,.error{
            display: block;
            width: 250px;
            padding: 10px;
            margin: 3px 0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        input{
            border: 1px solid #ccc;
        }
        button{
            background-color: #114399;
            color: #c8dee0;
        }
        .hava_durumu{
            font-size: medium;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
            color: #888;
            border-top: 1px solid #e0e0e0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    {%if error %}
    <div clas="error">{{error}}</div>
    {% endif %}
    {%if not sehir_adi%}
    <div style="font-weight: bold; margin-bottom: 7px;">Konum Aratın</div>
    {% endif %}
    <form class="hide" method="POST" action="/ara">
        <input required type="text" name="sehir" id="sehir">
        <br>
        <button type="submit">Ara</button>
    </form>
    {% if sehir_adi %}
    <img style="width: 250px; height: 250px;" src="{{ image }}" alt=""><br>
    <div class="hava_durumu">
        Konum: {{ sehir_adi }}<br>
        Sicaklik: {{ sicaklik }}°C<br>
        Hava Durumu: {{ hava_durumu }}
    </div>
    {% endif %}

    <script>
        {% if not sehir_adi %}
        navigator.geolocation.getCurrentPosition(
            function(pozition){
                const lat = pozition.coords.latitude;
                const lon = pozition.coords.longitude;
                window.location.href = `/konum?lat=${lat}&lon=${lon}`;
            },
            function(error){
                console.log("Konum alinamadi", error.message)
            }
        );
        {% endif %}
        const form = document.getElementsByClassName("hide")[0]
        if ("{{sehir_adi}}"){
            form.style.display = "none";
        }
    </script>
    <footer>© 2026 Salih Damar</footer>
</body>
</html>
