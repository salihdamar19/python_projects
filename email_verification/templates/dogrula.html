<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogrula</title>
    
<style>
    * {
        box-sizing: border-box;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        padding: 20px;
    }

    h1 {
        font-size: clamp(18px, 3vw, 24px);
        text-align: center;
        margin-bottom: 10px;
    }

    p {
        font-size: clamp(14px, 2.5vw, 16px);
        text-align: center;
    }

    input, button {
        display: block;
        width: 250px;
        padding: 10px;
        margin: 6px 0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        box-sizing: border-box;
        appearance: none;
        -webkit-appearance: none;
    }

    input {
        border: 1px solid #ccc;
    }

    button {
        background-color: #0e2e78;
        color: #d1c021;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background-color: #163a94;
    }
    footer {
        text-align: center;
        padding: 20px;
        margin-top: 40px;
        font-size: 14px;
        color: #888;
        border-top: 1px solid #e0e0e0;
        font-family: Arial, sans-serif;
    }
</style>
</head>
<body>
    {% if message == "Kod Dogru" %}
    <meta http-equiv="refresh" content="2;url={{ url_for('anasayfa') }}">
    {% endif %}
    <h1>Dogrulama kodunu gir</h1>
    <h5 id="bekleme-mesaji"></h5>
    <form method="POST" action="/dogrula">
        <input type="text" name="kod" placeholder="6 haneli kodu gir" required><br>
        <button type="submit">Dogrula</button>
    </form>
    <form action="/uret" method="POST">
        <input type="hidden" name="email" value="{{session['email']}}">
        <button type="submit">Yeni Kod Gonder</button>
    </form>
    <script>
        let kalanSure = {{ kalan_sure if kalan_sure else 0 }};

        function geriSayim() {
            const mesajElemani = document.getElementById("bekleme-mesaji");
            
            if(kalanSure > 0) {
                mesajElemani.textContent = `Lutfen yeni kod icin ${kalanSure}sn bekleyiniz.`;
                kalanSure = kalanSure - 1;
                setTimeout(geriSayim,1000);
            }else{
                mesajElemani.textContent = `Simdi yeni kod isteyebilirsiniz.`;
            }

        }

        if (kalanSure > 0){
            geriSayim();
        }
    </script>
    <footer>© 2026 Salih Damar</footer>
</body>
</html>
