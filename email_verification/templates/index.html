<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogrulama Sistemi</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        padding: 20px;
    }

    h1 {
        font-size: clamp(18px, 3vw, 24px);
        text-align: center;
        margin-bottom: 10px;
    }

    p {
        font-size: clamp(14px, 2.5vw, 16px);
        text-align: center;
    }

    input, button {
        display: block;
        width: 250px;
        padding: 10px;
        margin: 6px 0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        box-sizing: border-box;
        appearance: none;
        -webkit-appearance: none;
    }

    input {
        border: 1px solid #ccc;
    }

    button {
        background-color: #0e2e78;
        color: #d1c021;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background-color: #163a94;
    }
</style>
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; ">
    <h1>Mail Adresini Gir</h1>
    <form method="POST" action="/uret">
        <input style="width: 100%; border:2px solid grey; border-radius: 3px;" type="email" name="email"><br>
        <button style="margin: 5px 5px 0 5px; width: 100%; color: #d1c021; background-color: #0e2e78; border-radius: 8px;" type="submit">Kod Gonder</button>
    </form>
</body>
</html>
