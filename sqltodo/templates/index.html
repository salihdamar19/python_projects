<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do App</title>
    <style>
        body{
            margin: 0 0 100px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        table{
            border-collapse: collapse;
        }
        table,th,td{
            border: 1px solid rgb(32, 189, 93);
        }
        th,td{
            width: 100px;
            text-align: center;
            vertical-align: middle;
        }
        div{
            width: 40vh;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(92, 92, 92, 0.3);
        }
        button{
            margin: 10px 0 10px 0;
            background: rgb(44, 188, 99);
            border-radius: 999px;
            box-sizing: border-box;
            color: #FFFFFF;
            cursor: pointer;
            font-family: Inter,Helvetica,"Apple Color Emoji","Segoe UI Emoji",NotoColorEmoji,"Noto Color Emoji","Segoe UI Symbol","Android Emoji",EmojiSymbols,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 24px;
            opacity: 1;
            outline: 0 solid transparent;
            padding: 8px 18px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            word-break: break-word;
            border: 0;
        }
        #add{
            width: 40vh;
        }
        #submit{
            width: 100%;
        }
        input{
            display: block;
            width: 250px;
            padding: 10px;
            margin: 3px 0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #ccc;
        }
        p{
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            top: 20px;
            left: 50%;
            background-color: #D8E8D5;
            color: 3E6842;
            width: 200px;
            height: 50px;
            border: none;
            border-radius: 15px;

            transform: translate(-50%, -100px);
            opacity: 0;

            transition: transform 0.5s ease, opacity 0.5s ease;

            z-index: 9999;
        }
    </style>
</head>
<body>
    <p id="hide_message">{{message}}</p>
    <button id="add">Add Task</button>
    <div id="hide">
        <form action="/add" method="POST">
            <input type="text" id="task" name="task">
            <button id="submit" type="submit">Submit</button>
        </form>
    </div>
    <table id="table">
        <thead>
            <th>ID</th>
            <th>Baslik</th>
            <th>Durum</th>
        </thead>
        <tbody>
            {% for gorev in gorevler %}
                <tr>
                    <td>{{gorev[0]}}</td>
                    <td>{{gorev[1]}}</td>
                    <td>{{ 'Yapildi' if gorev[2] else 'Yapilmadi' }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>
        const button = document.getElementById("add");
        const div = document.getElementById("hide");
        const submit = document.getElementById("submit");
        const table = document.getElementById("table");
        const message = document.getElementById("hide_message")
        var buttonCount = 0;
        
        function showMessage(){
             requestAnimationFrame(() => {
                    message.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;

                    transform: translate(-50%, -100px);
                    opacity: 0;

                    transition: transform 0.5s ease, opacity 0.5s ease;

                    z-index: 9999;
                    transform: translate(-50%, 0);
                    opacity: 1;
                    `
            });

                setTimeout(() =>{
                    message.style.cssText = `
                        position: fixed;
                        top: 20px;
                        left: 50%;

                        transform: translate(-50%, -100px);
                        opacity: 0;

                        transition: transform 0.5s ease, opacity 0.5s ease;

                        z-index: 9999;
                    `
                },2000);
        };
        {% if message %}
        showMessage();
        {% endif %}
        button.addEventListener("click", function(){
            buttonCount++;
            if(buttonCount % 2 == 1){
                div.style.display = "flex";
                table.style.display = "none";
                button.style.display = "none";
            }else{
                div.style.display = "none";
                table.style.display = "block";
                button.style.display = "block";
            }
        });

        submit.addEventListener("click", function() {
           div.style.display = "none";
            table.style.display = "block";
            button.style.display = "block";
        });


    </script>

</body>
</html>
