<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do App</title>
    <style>
        body{
            margin: 0 0 5vh 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        table{
            border-collapse: collapse;
        }
        table,th,td{
            border: 1px solid rgb(32, 189, 93);
        }
        th,td{
            width: 100px;
            text-align: center;
            vertical-align: middle;
        }
        div{
            width: 40vh;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(92, 92, 92, 0.3);
        }
        button{
            margin: 10px 0 10px 0;
            background: #2cbc63;
            border-radius: 999px;
            box-sizing: border-box;
            color: #FFFFFF;
            cursor: pointer;
            font-family: Inter,Helvetica,"Apple Color Emoji","Segoe UI Emoji",NotoColorEmoji,"Noto Color Emoji","Segoe UI Symbol","Android Emoji",EmojiSymbols,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 24px;
            opacity: 1;
            outline: 0 solid transparent;
            padding: 8px 18px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            word-break: break-word;
            border: 0;
        }
        #add, #del{
            width: 40vh;
        }
        #del{
            background-color:#d14141;
        }
        #submit{
            width: 100%;
        }
        input{
            display: block;
            width: 250px;
            padding: 10px;
            margin: 3px 0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #ccc;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        p{
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            top: 20px;
            left: 50%;

            color: 3E6842;
            width: 200px;
            height: 50px;
            border: none;
            border-radius: 15px;

            transform: translate(-50%, -100px);
            opacity: 0;

            transition: transform 0.5s ease, opacity 0.5s ease;

            z-index: 9999;
        }
    </style>
</head>
<body>
    <p id="hide_message" style="">{{message}}</p>
    <button id="add">Add Task</button>
    <div id="hide">
        <form id="form" action="" method="POST">
            <p id="message"></p>
            <input type="" id="task" name="task">
            <button id="submit" type="submit">Submit</button>
        </form>
    </div>
    <table id="table">
        <thead>
            <th>ID</th>
            <th>Baslik</th>
            <th>Durum</th>
        </thead>
        <tbody>
            {% for gorev in gorevler %}
                <tr>
                    <td>{{gorev[0]}}</td>
                    <td>{{gorev[1]}}</td>
                    <td style="background-color: {{ 'lightgreen' if gorev[2] else 'white' }};">
                        <form method="POST" action="/toggle" onsubmit="return confirm('{{gorev[1]}} icin gorev ilerlemesini degistirmek istiyor musun?')">
                            <input type="hidden" name="id" value="{{gorev[0]}}">
                            <input type="hidden" name="progress" value="{{gorev[2]}}">
                            <button type="submit" style="width:100%; height:100%; border:none; background:none; cursor:pointer; color:black; text-wrap:nowrap;">{{'Yapildi' if gorev[2] else 'Yapilmadi'}}</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <button id="del">Delete Task</button>
    <script>

        const addButton = document.getElementById("add");
        const delButton = document.getElementById("del");
        const input_element = document.getElementById("task");
        const div = document.getElementById("hide");
        const submit = document.getElementById("submit");
        const table = document.getElementById("table");
        const message = document.getElementById("hide_message");
        const form = document.getElementById("form");
        const form_message = document.getElementById("message");
        var addButtonCount = 0;
        var delButtonCount = 0;
        
        function showMessage(){
             requestAnimationFrame(() => {
                    message.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    background-color: {{renk}};
                    transform: translate(-50%, -100px);
                    opacity: 0;

                    transition: transform 0.5s ease, opacity 0.5s ease;

                    z-index: 9999;
                    transform: translate(-50%, 0);
                    opacity: 1;
                    `
            });

                setTimeout(() =>{
                    message.style.cssText = `
                        position: fixed;
                        top: 20px;
                        left: 50%;
                        background-color: {{renk}};
                        transform: translate(-50%, -100px);
                        opacity: 0;

                        transition: transform 0.5s ease, opacity 0.5s ease;

                        z-index: 9999;
                    `
                },2000);
        };
        {% if message %}
        showMessage();
        {% endif %}
        addButton.addEventListener("click", function(){
            form.action = "/add";
            input_element.type = "text"
            addButtonCount++;
            if(addButtonCount % 2 == 1){
                form_message.textContent = "Lutfen eklemek istediginiz gorevin adini yaziniz:"
                div.style.display = "flex";
                table.style.display = "none";
                addButton.style.display = "none";
            }else{
                div.style.display = "none";
                table.style.display = "block";
                addButton.style.display = "block";
            }
        });
        
        delButton.addEventListener("click", function(){
            form.action = "/del";
            input_element.type = "number";
            delButtonCount++;
            if(delButtonCount % 2 == 1){
                form_message.textContent = "Lutfen silmek istediginiz gorevin ID'sini giriniz:"
                div.style.display = "flex";
                table.style.display = "none";
                addButton.style.display = "none";
            }else{
                div.style.display = "none";
                table.style.display = "block";
                addButton.style.display = "block";
            }
        });

        submit.addEventListener("click", function() {
           div.style.display = "none";
            table.style.display = "block";
            addButton.style.display = "block";
        });

        form.actio
    </script>

</body>
</html>
