<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Sign in</title>
    <style>
        body{
            background-color: #0d0d0d;
            font-family: Neue Montreal,sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        input{
            display: flex;
            margin: 5px;
            padding: 20px;
            background-color: #0d0d0d;
            color: #c7c7c7;
            border: 2px solid #c7c7c7;
            font-weight: bold;
            font-size: medium;
            width: 80%;
            max-width: 400px;
        }
        a{
            color: #d1b8ff;
        }
        div{
            color: #c7c7c7;
        }
        button{
            border: none;
            background-color: white;
            color: #0d0d0d;
            margin: 7px;
            padding: 25px 40px;
            width: auto;
            height: auto;
            font-weight: 400;
            font-size: clamp(14px, 3vw, 20px);   /* responsive, hatirlarsin */
        }
        button:hover{
            background-color: #8a05ff;
            color: white;
            cursor: pointer;
        }
        p{
            transition: opacity 0.5s ease-out;
            opacity: 1;
            color: white;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
    {% if message %}
        <p id="message">{{message}}</p>
    {% endif %}
    <h5 id="bekleme-mesaji"></h5>
    <form id="form" method="POST" action="{{ action or '/signin' }}">
        <input id="fullName" type="hidden" placeholder="full name" name="fullName" required>
        <input id="email" type="email" placeholder="email" name="email" required>
        <input id="password" type="password" placeholder="don't tell anyone" name="password" required>
        <input id="code" type="hidden" name="code" placeholder="6-digit code">
        <button id="signbutton" type="submit">Sign in</button>
        <div>
        <span id="change-span">Need an account?</span>
        <a id="change-action" href="javascript:void(0)">Sign up</a></div>
        <div>
        <span id="hide-span">Forgot your password?</span>
        <a id="hide-link" href="javascript:void(0)">Get a code</a>
        </div>
    </form>
    <script>
        const form = document.getElementById("form");
        const link = document.getElementById("change-action");
        const fullNameInput = document.getElementById("fullName");
        const emailInput = document.getElementById("email")
        const passwordInput = document.getElementById("password");
        const codeInput = document.getElementById("code");
        const span = document.getElementById("change-span");
        const signbutton = document.getElementById("signbutton");
        const hideLink = document.getElementById("hide-link");
        const hideSpan = document.getElementById("hide-span");
        const title_element = document.getElementById("title");
        let linkCount = 0;
        link.addEventListener("click", function(){
            linkCount++;
            if(linkCount % 2 == 1){
                form.action = "/signup";
                fullNameInput.type = "text";
                emailInput.type = "email";
                passwordInput.type = "password";
                codeInput.type = "hidden";
                signbutton.textContent = "Sign up";
                span.textContent = "Already have an account?";
                link.textContent = "Sign in";
                hideLink.style.display = "none";
                hideSpan.style.display = "none";
            }else{
                form.action = "/signin";
                fullNameInput.type = "hidden";
                emailInput.type = "email";
                passwordInput.type = "password";
                codeInput.type = "hidden";
                codeInput.type = "hidden";
                signbutton.textContent = "Sign in";
                span.textContent = "Need an account?";
                link.textContent = "Sign up";
                hideLink.style.display = "inline";
                hideSpan.style.display = "inline";
            }
        });

        hideLink.addEventListener("click", function(){
            form.action = "/send";
            fullNameInput.type = "hidden";
            emailInput.type = "email";
            passwordInput.type = "hidden";
            codeInput.type = "hidden";
            hideLink.style.display = "none";
            hideSpan.style.display = "none";
            signbutton.textContent = "Send Code";
            span.textContent = "Need an account?";
            link.textContent = "Sign up";
        });

        if (form.action.includes("/verify")){
            fullNameInput.type = "hidden";
            emailInput.type = "hidden";
            passwordInput.type = "hidden";
            codeInput.type = "number";
            hideLink.style.display = "none";
            hideSpan.style.display = "none";
            signbutton.textContent = "Send Code";
            span.textContent = "Need an account?";
            link.textContent = "Sign up";
        };
        
        /*
            fullNameInput.type = "hidden";
            emailInput.type = "email";
            passwordInput.type = "hidden";
            codeInput.type = "hidden";
            hideLink.style.display = "none";
            hideSpan.style.display = "none";
            signbutton.textContent = "Send Code";
            span.textContent = "Need an account?";
            link.textContent = "Sign up";
        */
        let kalanSure = {{ kalan_sure if kalan_sure else 0 }};

        function geriSayim() {
            const mesajElemani = document.getElementById("bekleme-mesaji");
            
            if(kalanSure > 0) {
                mesajElemani.textContent = `Lutfen yeni kod icin ${kalanSure}sn bekleyiniz.`;
                kalanSure = kalanSure - 1;
                setTimeout(geriSayim,1000);
            }else{
                mesajElemani.textContent = `Simdi yeni kod isteyebilirsiniz.`;
            }

        }

        setTimeout(function(){
            document.getElementById("message").style.display = "none";
        },2500);
        
    </script>
</body>
</html>
